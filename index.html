<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة المحكمة السرية</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4">

  <div id="app" class="max-w-3xl mx-auto space-y-6">
    <header class="text-center py-6 border-b border-slate-800">
      <h1 class="text-3xl font-bold tracking-wider text-amber-500">⚖️ المحكمة السرية</h1>
      <p class="text-slate-400 text-sm mt-1">حيث تتشابك المؤامرات، وتُحاك التقارير بالذكاء الاصطناعي</p>
    </header>

    <!-- مرحلة إدخال اللاعبين وبدء اللعبة -->
    <div id="setup-screen" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
      <h2 class="text-xl font-semibold text-amber-400">إعداد أسماء النبلاء (المشاركين)</h2>
      <div id="players-inputs" class="space-y-3">
        <div class="flex gap-2">
          <input type="text" placeholder="اسم اللاعب 1" class="player-name-input flex-1 bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl focus:outline-none focus:border-amber-500" value="إيفا">
          <input type="text" placeholder="اسم اللاعب 2" class="player-name-input flex-1 bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl focus:outline-none focus:border-amber-500" value="سارة">
        </div>
      </div>
      <button onclick="addPlayerInput()" class="text-sm text-amber-400 hover:underline">+ إضافة لاعب آخر</button>
      <div class="pt-4">
        <button onclick="startGame()" class="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg">بدء جلسة المحكمة وتوزيع البطاقات</button>
      </div>
    </div>

    <!-- شاشة اللعب الرئيسية -->
    <div id="game-screen" class="hidden space-y-6">
      <!-- لوحة النبلاء (السمعة والبطاقات) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="players-dashboard"></div>

      <!-- لوحة الإجراءات والبطاقات للجلسة -->
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
        <h3 class="text-lg font-bold text-amber-400">إجراءات الجولة للـلاعب الحالي: <span id="current-actor-name" class="text-white"></span></h3>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-slate-400 mb-1">اختر البطاقة للاستخدام:</label>
            <select id="selected-card" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm"></select>
          </div>
          <div>
            <label class="block text-sm text-slate-400 mb-1">الهدف (إن أمكن):</label>
            <select id="target-player" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-sm"></select>
          </div>
        </div>

        <div class="flex flex-wrap gap-3 pt-2">
          <button onclick="executeAction()" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2.5 rounded-xl font-semibold text-sm transition">تنفيذ دور اللاعب</button>
          <button onclick="buyCard()" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2.5 rounded-xl font-semibold text-sm transition">شراء بطاقة جديدة (4 نقاط) 🪙</button>
          <button onclick="revealTargetCards()" class="bg-amber-600 hover:bg-amber-500 text-slate-950 px-5 py-2.5 rounded-xl font-bold text-sm transition">كشف بطاقات الهدف 👁️</button>
        </div>

        <div class="pt-4 border-t border-slate-800 flex justify-between items-center">
          <span class="text-xs text-slate-400">عند انتهاء أدوار الجميع، انتقل لإصدار التقرير الاستخباراتي:</span>
          <button onclick="resolveRound()" class="bg-rose-600 hover:bg-rose-500 px-6 py-2.5 rounded-xl font-bold text-sm transition shadow-lg">إنهاء الجولة وإصدار تقرير القاضي 📜</button>
        </div>
      </div>
    </div>

    <!-- نافذة التقرير والتصويت الجماعي -->
    <div id="report-screen" class="hidden bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
      <h3 class="text-xl font-bold text-amber-400" id="report-title">تقرير المحكمة الاستخباري</h3>
      <div id="report-content" class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-slate-300 leading-relaxed text-sm"></div>
      
      <div class="pt-4 border-t border-slate-800 space-y-3">
        <h4 class="font-semibold text-amber-400">⚖️ التصويت الجماعي للمجلس (من هو المتهم المدان؟):</h4>
        <select id="group-accused-select" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm"></select>
        <button onclick="resolveGroupVote()" class="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg">حسم التصويت وإعلان الحكم</button>
      </div>
      
      <div id="verdict-result" class="hidden font-bold text-emerald-400 text-center pt-2"></div>
      <button onclick="nextRound()" class="hidden id-next-round w-full bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-sm font-semibold transition">الانتقال للجولة التالية</button>
    </div>
  </div>

  <script>
    let gameState = {
      players: [],
      currentActorIndex: 0,
      roundActions: [],
      courtCase: null
    };

    function addPlayerInput() {
      const container = document.getElementById('players-inputs');
      const count = container.children.length + 1;
      const div = document.createElement('div');
      div.className = 'flex gap-2';
      div.innerHTML = `
        <input type="text" placeholder="اسم اللاعب ${count}" class="player-name-input flex-1 bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl focus:outline-none focus:border-amber-500">
        <button onclick="this.parentElement.remove()" class="text-rose-400 px-3 text-sm hover:underline">حذف</button>
      `;
      container.appendChild(div);
    }

    async function startGame() {
      const inputs = document.querySelectorAll('.player-name-input');
      const names = Array.from(inputs).map(i => i.value.trim()).filter(Boolean);
      if (names.length < 2) {
        alert('يجب إدخال لاعبين اثنين على الأقل لبدء الجلسة.');
        return;
      }

      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'start_game',
          players: names.map((name, idx) => ({ id: `p-${idx+1}`, name, reputation: 10 }))
        })
      });
      const data = await res.json();
      gameState.players = data.players;
      gameState.currentActorIndex = 0;
      gameState.roundActions = [];

      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      renderDashboard();
      updateTurnUI();
    }

    function renderDashboard() {
      const dash = document.getElementById('players-dashboard');
      dash.innerHTML = gameState.players.map(p => `
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2">
          <div class="flex justify-between items-center">
            <span class="font-bold text-amber-400">${p.name}</span>
            <span class="bg-slate-800 px-3 py-1 rounded-full text-xs text-amber-200">السمعة: ${p.reputation} 🪙</span>
          </div>
          <div class="text-xs text-slate-400">البطاقات في اليد (${p.cards.length}/3):</div>
          <div class="flex flex-wrap gap-1">
            ${p.cards.length ? p.cards.map(c => `<span class="bg-slate-800 border border-slate-700 px-2 py-1 rounded text-xs text-slate-300">${c.name}</span>`).join('') : '<span class="text-slate-500 text-xs">لا توجد بطاقات</span>'}
          </div>
        </div>
      `).join('');
    }

    function updateTurnUI() {
      const actor = gameState.players[gameState.currentActorIndex];
      if (!actor || actor.reputation <= 0) {
        // تخطي من انتهت سمعته
        gameState.currentActorIndex = (gameState.currentActorIndex + 1) % gameState.players.length;
        updateTurnUI();
        return;
      }

      document.getElementById('current-actor-name').textContent = actor.name;
      
      const cardSelect = document.getElementById('selected-card');
      cardSelect.innerHTML = actor.cards.map(c => `<option value="${c.id}">${c.name} - ${c.description}</option>`).join('') || '<option value="">لا توجد بطاقات</option>';

      const targetSelect = document.getElementById('target-player');
      targetSelect.innerHTML = gameState.players.filter(p => p.id !== actor.id && p.reputation > 0).map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    function executeAction() {
      const actor = gameState.players[gameState.currentActorIndex];
      const cardId = document.getElementById('selected-card').value;
      const targetId = document.getElementById('target-player').value;

      const card = actor.cards.find(c => c.id === cardId);
      if (!card) {
        alert('الرجاء اختيار بطاقة صحيحة.');
        return;
      }

      gameState.roundActions.push({
        playerId: actor.id,
        usedCard: card,
        targetId: targetId || null
      });

      // الانتقال للاعب التالي
      gameState.currentActorIndex = (gameState.currentActorIndex + 1) % gameState.players.length;
      updateTurnUI();
      renderDashboard();
      alert('تم تسجيل دور هذا اللاعب بنجاح.');
    }

    async function buyCard() {
      const actor = gameState.players[gameState.currentActorIndex];
      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'buy_card', players: gameState.players, playerId: actor.id })
      });
      const data = await res.json();
      if (data.error) {
        alert(data.message);
        return;
      }
      gameState.players = data.players;
      renderDashboard();
      updateTurnUI();
      alert(`تم شراء بطاقة بنجاح: ${data.boughtCard.name}`);
    }

    async function revealTargetCards() {
      const targetId = document.getElementById('target-player').value;
      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'reveal_target_cards', players: gameState.players, targetId })
      });
      const data = await res.json();
      if (data.error) {
        alert('تعذر الكشف.');
        return;
      }
      const namesCards = data.cards.map(c => c.name).join('، ') || 'لا توجد بطاقات';
      alert(`بطاقات اللاعب ${data.targetName} الحالية هي: [${namesCards}]`);
    }

    async function resolveRound() {
      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'resolve_round', players: gameState.players, actions: gameState.roundActions })
      });
      const data = await res.json();
      gameState.players = data.players;
      gameState.courtCase = data.courtCase;

      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('report-screen').classList.remove('hidden');

      document.getElementById('report-title').textContent = data.courtCase.title;
      document.getElementById('report-content').innerHTML = `
        <p class="mb-2"><strong>تقرير التحقيق الاستخباري:</strong> ${data.courtCase.clue}</p>
        <p class="text-xs text-amber-400">نسبة الثقة الاستخباراتية: ${data.courtCase.confidence}%</p>
      `;

      // إعداد قائمة المتهمين للتصويت الجماعي
      const accusedSelect = document.getElementById('group-accused-select');
      accusedSelect.innerHTML = `<option value="NONE">لا يوجد اتهام / بريء</option>` + gameState.players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    async function resolveGroupVote() {
      const accusedId = document.getElementById('group-accused-select').value;
      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'resolve_group_vote',
          players: gameState.players,
          trueCulpritId: gameState.courtCase.trueCulpritId,
          accusedId
        })
      });
      const data = await res.json();
      gameState.players = data.players;

      const verdictEl = document.getElementById('verdict-result');
      verdictEl.textContent = data.verdictMsg;
      verdictEl.classList.remove('hidden');
      document.querySelector('.id-next-round').classList.remove('hidden');
    }

    function nextRound() {
      gameState.currentActorIndex = 0;
      gameState.roundActions = [];
      document.getElementById('report-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('verdict-result').classList.add('hidden');
      document.querySelector('.id-next-round').classList.add('hidden');
      renderDashboard();
      updateTurnUI();
    }
  </script>
</body>
</html>
