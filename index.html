<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحكمة السرية</title><style>
:root{--bg:#080b14;--panel:#121a2a;--line:#26334d;--red:#f43f5e;--gold:#fbbf24;--purple:#a855f7;--blue:#38bdf8;--green:#22c55e}*{box-sizing:border-box}body{margin:0;padding:14px;background:radial-gradient(circle at top,#17213a,#080b14 65%);color:#f8fafc;font-family:system-ui,sans-serif}.app{max-width:820px;margin:auto}.panel{background:#121a2aee;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0005}button{width:100%;padding:11px;margin-top:8px;border:0;border-radius:9px;background:var(--red);color:#fff;font-weight:700;cursor:pointer}button.alt{background:#334155}button.gold{background:#a16207}input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid var(--line);border-radius:9px;background:#070b14;color:#fff}textarea{min-height:80px}.grid,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.player,.card,.box{padding:11px;border-radius:10px}.player{background:#080b14;border:1px solid var(--line);text-align:center}.card{border:2px solid #334155;background:#1a2437;cursor:pointer}.card.sel{border-color:var(--red);background:#36202c}.box{margin:9px 0;white-space:pre-line}.inbox{border-right:4px solid var(--blue);background:#10263b}.ally{border-right:4px solid var(--purple);background:#28173b}.event{border-right:4px solid var(--gold);background:#30200b}.clue{border-right:4px solid var(--purple);background:#21152f}.muted{color:#a9b4c7;font-size:.86em}.small{font-size:.78em;color:#cbd5e1}.danger{color:#fb7185}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{display:inline-block;background:#44215e;padding:3px 7px;border-radius:8px;font-size:.75em}
</style></head><body><main class="app"><div class="top"><h1>المحكمة السرية</h1><button class="alt" style="width:auto" onclick="newGame()">جلسة جديدة</button></div>
<section id="setup" class="panel"><h2>إعداد الجلسة</h2><p class="muted">لعبة تمرير هاتف. البريد وعروض التحالف سرية وتظهر فقط أثناء دور صاحبها.</p><input id="names" value="أحمد, سارة, خالد"><button onclick="startGame()">بدء اللعبة</button></section>
<section id="game" class="hidden"><div id="status" class="grid"></div><section id="action" class="panel"><div id="curtain"><h2 id="turnTitle"></h2><button id="curtainButton" onclick="openTurn()">فتح الدور السري</button></div><div id="turn" class="hidden"><h2 id="playerName"></h2><div id="inbox" class="box inbox hidden"></div><div id="offer" class="box ally hidden"></div><div id="allyStatus" class="box ally hidden"></div><div id="shop" class="box" style="background:#0d1727"><b>السوق السرية — السمعة الحالية: <span id="shopRep"></span></b><select id="buySelect"></select><button class="gold" onclick="buySelectedCard()">شراء البطاقة المحددة</button><div class="small">المشتريات تحفظ في مخزون اللاعب، والبطاقات محدودة ولا تتولد عشوائيًا.</div></div><h3>يدك الحالية</h3><div id="cards" class="cards"></div><div id="targetArea" class="hidden"><label>الهدف</label><select id="target"></select></div><div id="textArea" class="hidden"><label>نص الرسالة السرية</label><textarea id="messageText" maxlength="300"></textarea></div><button onclick="submitAction()">تأكيد الحركة وتسليم الهاتف</button></div></section>
<section id="recap" class="panel hidden"><h2>تقرير الجولة</h2><div id="event" class="box event hidden"></div><div id="case" class="box"></div><div id="report" class="box clue"></div><div id="clue" class="box clue"></div><button onclick="startVote()">الانتقال إلى التصويت السري</button></section>
<section id="vote" class="panel hidden"><div id="voteCurtain"><h2 id="voteTitle"></h2><button onclick="openVote()">فتح التصويت</button></div><div id="voteForm" class="hidden"><div id="voteCase" class="box"></div><select id="voteTarget"></select><button onclick="submitVote()">تأكيد التصويت وتسليم الهاتف</button></div></section></section></main>
<script>
const CATALOG={ALLIANCE_OFFER:{name:'دعوة التحالف',description:'إرسال عرض تحالف سري إلى لاعب واحد.',effect:'تحالف سري',targetRequired:true,price:5,exceptional:true},SECRET_MSG:{name:'رسالة مشفرة',description:'إرسال نص خاص إلى لاعب واحد.',effect:'رسالة خاصة',targetRequired:true,price:3},ATTACK:{name:'ضربة في الظلام',description:'تخفض 3 سمعة من الهدف وتفتح قضية.',effect:'هجوم',targetRequired:true,price:4},STEAL:{name:'سرقة النفوذ',description:'تنقل نقطتين من سمعة الهدف إليك.',effect:'سرقة',targetRequired:true,price:4},BOOST:{name:'خطاب مؤثر',description:'تكسب نقطتي سمعة.',effect:'سمعة',targetRequired:false,price:3},INTERROGATE:{name:'سؤال القاضي',description:'تصلك معلومة خاصة عن حركة الهدف.',effect:'تحقيق',targetRequired:true,price:4},FORCE_REVEAL:{name:'مرآة السجلات',description:'يكشف مخزون الهدف علنًا.',effect:'كشف',targetRequired:true,price:6},SHIELD:{name:'ستارة الحماية',description:'تحميك من أول خسارة سمعة.',effect:'حماية',targetRequired:false,price:6,exceptional:true},ALLY_SHIELD:{name:'درع الحليف',description:'يحمي حليفك من أول خسارة.',effect:'حماية التحالف',targetRequired:false,price:7,exceptional:true},DOUBLE_VOTE:{name:'صوتان في الظل',description:'يضاعف وزن تصويتك.',effect:'تصويت',targetRequired:false,price:7,exceptional:true},EVIDENCE_FOG:{name:'ضباب الدليل',description:'يخفض ثقة التقرير.',effect:'تضليل',targetRequired:false,price:5},TRUTH_PIN:{name:'دبوس الحقيقة',description:'يرفع الثقة قليلًا دون اسم.',effect:'قرينة',targetRequired:false,price:7,exceptional:true},REPUTATION_DRAIN:{name:'استنزاف الهيبة',description:'تخفض نقطة من سمعة الهدف.',effect:'استنزاف',targetRequired:true,price:3},REPUTATION_GIFT:{name:'منحة مجهولة',description:'تمنح الهدف نقطتي سمعة.',effect:'منحة',targetRequired:true,price:3},SWAP_REPUTATION:{name:'مقايضة السمعة',description:'تبادل نقطة سمعة مع الهدف.',effect:'مقايضة',targetRequired:true,price:5},WATCH:{name:'عين المراقب',description:'تصلك إشارة غامضة عن الهدف.',effect:'مراقبة',targetRequired:true,price:5},SILENCE:{name:'ختم الصمت',description:'يضغط على الهدف برسالة خاصة.',effect:'ضغط',targetRequired:true,price:4},DECOY:{name:'طُعم مضلل',description:'يجعل الدليل أكثر تضليلًا.',effect:'تضليل',targetRequired:false,price:5},CANCEL_OFFER:{name:'ختم الرفض',description:'يلغي عرضًا واردًا.',effect:'إلغاء عرض',targetRequired:false,price:4},MARKET_DISCOUNT:{name:'قسيمة السوق',description:'تخفض أول شراء تالٍ.',effect:'خصم',targetRequired:false,price:4},CARD_DRAW:{name:'سحب إضافي',description:'إشعار بسحب إضافي من السوق.',effect:'سحب',targetRequired:false,price:6,exceptional:true},SAFE_PASS:{name:'مرور آمن',description:'يحميك من حدث عشوائي واحد.',effect:'أمان',targetRequired:false,price:6,exceptional:true},PUBLIC_CLUE:{name:'قصاصة علنية',description:'تضيف قرينة عامة بلا اسم.',effect:'قرينة عامة',targetRequired:false,price:5},REVERSE_SUSPICION:{name:'قلب الشبهة',description:'يجعل التقرير أكثر غموضًا.',effect:'قلب الشبهة',targetRequired:false,price:6},FINAL_WHISPER:{name:'همسة الختام',description:'تضيف تحذيرًا غامضًا للتقرير.',effect:'تقرير',targetRequired:false,price:8,exceptional:true}};
let state=null,selected=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('bonemotion-state',JSON.stringify(state))}function load(){try{return JSON.parse(localStorage.getItem('bonemotion-state'))}catch{return null}}function newGame(){localStorage.removeItem('bonemotion-state');location.reload()}
function startGame(){const names=$('names').value.split(',').map(x=>x.trim()).filter(Boolean);if(names.length<2)return alert('أدخل اسمين على الأقل');const t=Date.now();state={players:names.map((name,i)=>({id:`p-${t}-${i}`,name,reputation:10,allyId:null,allyRoundsLeft:0,shield:0,allyShield:0,safePass:0,marketDiscount:0,inventory:{ALLIANCE_OFFER:1,SECRET_MSG:1,ATTACK:1,STEAL:1,BOOST:1}})),pendingMessages:{},pendingOffers:{},round:0,currentTurn:0,actions:[],hands:{},votes:[],voteTurn:0,currentCase:null,report:null,randomEvent:null};save();showGame();startRound()}
function showGame(){$('setup').classList.add('hidden');$('game').classList.remove('hidden');renderStatus()}function renderStatus(){$('status').innerHTML=state.players.map(p=>`<div class="player"><b>${esc(p.name)}</b><br>${p.reputation>0?'⭐ '+p.reputation:'<span class="danger">مقصى</span>'}</div>`).join('')}
function clearPrivate(){selected=null;$('messageText').value='';$('target').innerHTML='';$('targetArea').classList.add('hidden');$('textArea').classList.add('hidden');$('cards').innerHTML='';$('inbox').innerHTML='';$('inbox').classList.add('hidden');$('offer').innerHTML='';$('offer').classList.add('hidden');$('allyStatus').innerHTML='';$('allyStatus').classList.add('hidden')}
function startRound(){state.round++;state.currentTurn=0;state.actions=[];state.hands={};state.currentCase=null;state.report=null;state.randomEvent=null;save();$('recap').classList.add('hidden');$('vote').classList.add('hidden');$('action').classList.remove('hidden');showCurtain()}
function showCurtain(){clearPrivate();while(state.currentTurn<state.players.length&&!state.players[state.currentTurn].reputation)state.currentTurn++;if(state.currentTurn>=state.players.length)return resolveRound();$('turn').classList.add('hidden');$('curtain').classList.remove('hidden');$('turnTitle').textContent=`سلّم الهاتف إلى: ${state.players[state.currentTurn].name}`;$('curtainButton').textContent='فتح الدور السري';$('curtainButton').onclick=openTurn}
function openTurn(){const p=state.players[state.currentTurn];clearPrivate();$('curtain').classList.add('hidden');$('turn').classList.remove('hidden');$('playerName').textContent=p.name;renderPrivate(p);renderShop(p);loadHand(p)}
function renderPrivate(p){const msgs=state.pendingMessages[p.id]||[];if(msgs.length){$('inbox').innerHTML=msgs.map(m=>`📩 <b>${esc(m.senderName||'النظام')}:</b> ${esc(m.text)}`).join('<hr>');$('inbox').classList.remove('hidden');delete state.pendingMessages[p.id]}const offers=state.pendingOffers[p.id]||[];if(offers.length){const o=offers[0];state.activeOffer=o;$('offer').innerHTML=`🤝 عرض تحالف سري من <b>${esc(o.fromName)}</b>. لن يظهر هذا التحالف في التقرير العام.<button onclick="respondAlliance(true)">قبول التحالف</button><button class="alt" onclick="respondAlliance(false)">رفض</button>`;$('offer').classList.remove('hidden')}if(p.allyId){const a=state.players.find(x=>x.id===p.allyId);$('allyStatus').textContent=`حليف سري: ${a?.name||'غير معروف'} — ${p.allyRoundsLeft} جولات`;$('allyStatus').classList.remove('hidden')}save()}
function renderShop(p){$('shopRep').textContent=p.reputation;$('buySelect').innerHTML=Object.entries(CATALOG).map(([id,c])=>`<option value="${id}">${c.name} — ${c.price} سمعة${c.exceptional?' ★':''}</option>`).join('')}
async function buySelectedCard(){const p=state.players[state.currentTurn],cardId=$('buySelect').value,card=CATALOG[cardId],cost=Math.max(0,card.price-(p.marketDiscount||0));if(p.reputation<cost)return alert('السمعة غير كافية');try{const d=await post({action:'buy_card',cardId,player:p});p.reputation-=d.cost;p.marketDiscount=0;p.inventory[cardId]=(p.inventory[cardId]||0)+1;state.hands[p.id]=state.hands[p.id]||[];if(!state.hands[p.id].some(x=>x.id===cardId))state.hands[p.id].push(card);save();renderStatus();renderShop(p);renderHand(p,state.hands[p.id]);alert(`تم شراء ${card.name}`)}catch(e){alert(e.message)}}
async function loadHand(p){if(state.hands[p.id])return renderHand(p,state.hands[p.id]);$('cards').innerHTML='<div class="box">جارٍ تجهيز اليد الثابتة...</div>';try{const d=await post({action:'deal_hand'});state.hands[p.id]=d.cards;save();renderHand(p,d.cards)}catch(e){alert('تعذر تجهيز اليد: '+e.message)}}
function renderHand(p,hand){$('cards').innerHTML=hand.map(c=>`<div class="card" onclick="selectCard('${esc(c.id)}',this)"><b>${esc(c.name)}</b>${c.exceptional?'<span class="tag">استثنائية</span>':''}<br><span class="small">${esc(c.description)}<br>الأثر: ${esc(c.effect)} · السعر: ${c.price}</span><br><span class="small">المخزون: ${p.inventory[c.id]||0}</span></div>`).join('')}
function selectCard(id,el){const p=state.players[state.currentTurn];selected=(state.hands[p.id]||[]).find(c=>c.id===id);if(!selected)return;document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');$('targetArea').classList.toggle('hidden',!selected.targetRequired);$('textArea').classList.toggle('hidden',selected.id!=='SECRET_MSG');if(selected.targetRequired)$('target').innerHTML=state.players.filter(x=>x.id!==p.id&&x.reputation>0).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
function submitAction(){if(!selected)return alert('اختر بطاقة');const p=state.players[state.currentTurn];if((p.inventory[selected.id]||0)<=0)return alert('لا تملك هذه البطاقة؛ اشتر نسخة من السوق');const targetId=selected.targetRequired?$('target').value:null;if(selected.targetRequired&&!targetId)return alert('اختر هدفًا');if(selected.id==='SECRET_MSG'&&!$('messageText').value.trim())return alert('اكتب الرسالة');p.inventory[selected.id]--;state.actions.push({playerId:p.id,targetId,cardId:selected.id,text:$('messageText').value.trim()});save();state.currentTurn++;showCurtain()}
function respondAlliance(ok){const p=state.players[state.currentTurn],o=state.activeOffer;if(!o)return;if(ok){const from=state.players.find(x=>x.id===o.fromId);if(from&&!from.allyId&&!p.allyId){p.allyId=from.id;p.allyRoundsLeft=4;from.allyId=p.id;from.allyRoundsLeft=4}}state.pendingOffers[p.id]=(state.pendingOffers[p.id]||[]).filter(x=>x.id!==o.id);delete state.activeOffer;save();renderPrivate(p);renderStatus()}
async function resolveRound(){clearPrivate();$('action').classList.add('hidden');try{const d=await post({action:'resolve_round',players:state.players,actions:state.actions,pendingMessages:state.pendingMessages,hands:state.hands});state.players=d.players;state.pendingMessages=d.pendingMessages||{};state.pendingOffers=d.pendingOffers||{};state.currentCase=d.courtCase;state.report=d.report;state.randomEvent=d.randomEvent;save();renderStatus();showRecap()}catch(e){$('action').classList.remove('hidden');$('curtain').classList.remove('hidden');$('turn').classList.add('hidden');$('turnTitle').textContent='تعذر حسم الجولة — البيانات محفوظة';$('curtainButton').textContent='إعادة المحاولة';$('curtainButton').onclick=resolveRound;alert(e.message)}}
function showRecap(){$('recap').classList.remove('hidden');$('case').textContent=state.currentCase.title;$('clue').textContent=state.currentCase.clue+`\nدرجة الثقة التقديرية: ${state.currentCase.confidence}%`;$('report').textContent=state.report?.report||'التقرير لا يملك برهانًا حاسمًا.';if(state.randomEvent){$('event').textContent=state.randomEvent.description;$('event').classList.remove('hidden')}else $('event').classList.add('hidden')}
function startVote(){state.voteTurn=0;state.votes=[];$('recap').classList.add('hidden');$('vote').classList.remove('hidden');showVoteCurtain()}function showVoteCurtain(){while(state.voteTurn<state.players.length&&!state.players[state.voteTurn].reputation)state.voteTurn++;if(state.voteTurn>=state.players.length)return finalizeVote();$('voteForm').classList.add('hidden');$('voteCurtain').classList.remove('hidden');$('voteTitle').textContent=`سلّم الهاتف إلى: ${state.players[state.voteTurn].name}`}function openVote(){$('voteCurtain').classList.add('hidden');$('voteForm').classList.remove('hidden');$('voteCase').textContent=state.currentCase.title;$('voteTarget').innerHTML='<option value="NONE">لا أحد</option>'+state.players.filter((p,i)=>p.reputation>0&&i!==state.voteTurn).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}function submitVote(){const p=state.players[state.voteTurn],v=$('voteTarget').value;state.votes.push({voterId:p.id,accusedId:v==='NONE'?null:v});state.voteTurn++;save();showVoteCurtain()}
async function finalizeVote(){try{const d=await post({action:'resolve_vote',players:state.players,votes:state.votes,trueCulpritId:state.currentCase.trueCulpritId});state.players=d.players;save();alert(d.verdictMsg+`\n\n${d.finalEvidence.conclusion}\n${d.finalEvidence.note}`);if(state.players.filter(p=>p.reputation>0).length<=1)return newGame();startRound()}catch(e){alert(e.message)}}async function post(body){let r;try{r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch{throw Error('تعذر الاتصال بمسار API')}let d;try{d=await r.json()}catch{throw Error(`استجابة API غير صالحة HTTP ${r.status}`)}if(!r.ok)throw Error(d.message||d.error||'خطأ API');return d}
state=load();if(state?.players?.length){showGame();if(state.currentCase)showRecap();else showCurtain()}
</script></body></html>
