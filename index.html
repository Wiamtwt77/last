<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة المحكمة السرية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4">

  <div id="app" class="w-full max-w-4xl mx-auto space-y-6">
    <!-- شاشة البداية وإدخال اللاعبين -->
    <div id="setup-screen" class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-2xl space-y-4">
      <h1 class="text-3xl font-black text-amber-500 text-center">المحكمة السرية</h1>
      <p class="text-gray-400 text-center text-sm">أدخل أسماء اللاعبين المشاركين في هذه الجلسة الاستخباراتية (3 إلى 8 لاعبين)</p>
      
      <div id="players-input-list" class="space-y-3">
        <div class="flex gap-2">
          <input type="text" class="player-name-input flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-amber-500" value="اللاعب 1" placeholder="اسم اللاعب">
        </div>
        <div class="flex gap-2">
          <input type="text" class="player-name-input flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-amber-500" value="اللاعب 2" placeholder="اسم اللاعب">
        </div>
        <div class="flex gap-2">
          <input type="text" class="player-name-input flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-amber-500" value="اللاعب 3" placeholder="اسم اللاعب">
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button onclick="addPlayerInput()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-amber-400 font-bold py-3 rounded-xl transition border border-gray-700">+ إضافة لاعب</button>
        <button onclick="startGame()" class="flex-1 bg-amber-600 hover:bg-amber-500 text-gray-950 font-black py-3 rounded-xl transition shadow-lg">بدء المحاكمة</button>
      </div>
    </div>

    <!-- لوحة اللعب الرئيسية -->
    <div id="game-board" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-gray-900 border border-gray-800 p-4 rounded-2xl shadow">
        <div>
          <h2 id="round-indicator" class="text-xl font-bold text-amber-400">الجولة رقم: 1</h2>
          <p id="current-player-turn" class="text-sm text-gray-400">دور اللاعب: --</p>
        </div>
        <div class="flex gap-2">
          <button onclick="openBuyCardModal()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-sm font-bold shadow transition">شراء بطاقة (4 نقاط)</button>
          <button onclick="nextPhase()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-sm font-bold shadow transition">إنهاء الدور والتصويت</button>
        </div>
      </div>

      <!-- شبكة اللاعبين وحالتهم -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="players-grid"></div>

      <!-- لوحة التحكم بالبطاقات والإجراءات -->
      <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl space-y-4">
        <h3 class="text-lg font-bold text-amber-400">إجراءات اللاعب الحالي</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">اختر البطاقة من يدك:</label>
            <select id="action-card-select" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none"></select>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">اللاعب المستهدف (إن وجد):</label>
            <select id="action-target-select" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm focus:outline-none"></select>
          </div>
          <div class="flex items-end">
            <button onclick="executeAction()" class="w-full bg-amber-600 hover:bg-amber-500 text-gray-950 font-bold py-2 rounded-xl text-sm transition shadow">تنفيذ الإجراء</button>
          </div>
        </div>
        <div id="card-desc-box" class="text-xs text-gray-400 bg-gray-950 p-3 rounded-xl border border-gray-800">وصف البطاقة المختارة يظهر هنا...</div>
      </div>
    </div>

    <!-- شاشة التقرير والتصويت الجماعي -->
    <div id="voting-screen" class="hidden bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-2xl space-y-6">
      <div class="border-b border-gray-800 pb-4">
        <h2 class="text-2xl font-black text-amber-400">تقرير المحكمة الاستخباري</h2>
        <div id="ai-court-clue" class="mt-3 bg-gray-950 p-4 rounded-xl border border-gray-800 text-gray-200 text-sm leading-relaxed"></div>
        <div id="global-event-box" class="mt-3 hidden bg-amber-950/40 border border-amber-800/60 p-3 rounded-xl text-amber-300 text-xs"></div>
      </div>

      <div class="space-y-4">
        <h3 class="text-lg font-bold text-white">التصويت الجماعي العلني (من هو الجاني؟)</h3>
        <div id="group-voting-list" class="space-y-3"></div>
      </div>

      <button onclick="submitGroupVotes()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl transition shadow-lg">حسم التصويت وإعلان الحكم</button>
    </div>
  </div>

  <!-- مودال كشف البطاقات الفوري -->
  <div id="reveal-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl max-w-md w-full space-y-4">
      <h3 class="text-lg font-bold text-amber-400">محتويات حقيبة الخصم (كشف فوري)</h3>
      <div id="reveal-content-list" class="space-y-2"></div>
      <button onclick="closeRevealModal()" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 rounded-xl text-sm">إغلاق</button>
    </div>
  </div>

  <script>
    let gameState = {
      players: [],
      currentTurnIndex: 0,
      roundNumber: 1,
      pendingActions: [],
      pendingMessages: {},
      courtCase: null
    };

    function addPlayerInput() {
      const list = document.getElementById('players-input-list');
      const count = list.children.length + 1;
      const div = document.createElement('div');
      div.className = 'flex gap-2';
      div.innerHTML = `<input type="text" class="player-name-input flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-amber-500" value="اللاعب ${count}" placeholder="اسم اللاعب">`;
      list.appendChild(div);
    }

    async function startGame() {
      const inputs = document.querySelectorAll('.player-name-input');
      const names = Array.from(inputs).map(i => i.value.trim()).filter(Boolean);
      if (names.length < 3) {
        alert('يجب أن يكون هناك 3 لاعبين على الأقل.');
        return;
      }

      const rawPlayers = names.map((name, i) => ({ id: `p-${i+1}`, name, reputation: 10, cards: [] }));
      
      const res = await fetch('/api/index', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'init_game', players: rawPlayers })
      });
      const data = await res.json();
      if (data.players) {
        gameState.players = data.players;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-board').classList.remove('hidden');
        updateBoard();
      }
    }

    function updateBoard() {
      const p = gameState.players[gameState.currentTurnIndex];
      document.getElementById('round-indicator').innerText = `الجولة رقم: ${gameState.roundNumber}`;
      document.getElementById('current-player-turn').innerText = `دور اللاعب الحالي: ${p.name} (السمعة: ${p.reputation})`;

      // رسم شبكة اللاعبين
      const grid = document.getElementById('players-grid');
      grid.innerHTML = gameState.players.map(pl => `
        <div class="bg-gray-900 border ${pl.id === p.id ? 'border-amber-500 shadow-amber-500/10' : 'border-gray-800'} p-4 rounded-2xl shadow space-y-2">
          <div class="flex justify-between items-center">
            <h4 class="font-bold text-white">${pl.name}</h4>
            <span class="bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-lg text-xs font-bold border border-amber-500/20">${pl.reputation} نقاط سمعة</span>
          </div>
          <div class="text-xs text-gray-400">عدد البطاقات في اليد: ${pl.cards.length} / 3</div>
        </div>
      `).join('');

      // تعبئة قائمة بطاقات اللاعب الحالي
      const cardSelect = document.getElementById('action-card-select');
      cardSelect.innerHTML = p.cards.length ? p.cards.map(c => `<option value="${c.instanceId}">${c.name} (${c.description})</option>`).join('') : '<option value="">لا توجد بطاقات في يدك</option>';

      // تعبئة قائمة الأهداف
      const targetSelect = document.getElementById('action-target-select');
      targetSelect.innerHTML = gameState.players.filter(pl => pl.id !== p.id).map(pl => `<option value="${pl.id}">${pl.name}</option>`).join('');
    }

    async function executeAction() {
      const p = gameState.players[gameState.currentTurnIndex];
      const cardId = document.getElementById('action-card-select').value;
      const targetId = document.getElementById('action-target-select').value;
      if (!cardId) {
        alert('اختر بطاقة لتنفيذها.');
        return;
      }

      const card = p.cards.find(c => c.instanceId === cardId);

      // ميزة كشف البطاقات الفورية
      if (card && card.effectType === 'REVEAL') {
        const targetPlayer = gameState.players.find(pl => pl.id === targetId);
        if (targetPlayer) {
          const contentList = document.getElementById('reveal-content-list');
          contentList.innerHTML = targetPlayer.cards.length ? targetPlayer.cards.map(c => `<div class="bg-gray-800 p-2 rounded-lg text-sm text-amber-300"><b>${c.name}</b>: ${c.description}</div>`).join('') : '<div class="text-gray-400 text-sm">حقيبة هذا اللاعب فارغة تماماً.</div>';
          document.getElementById('reveal-modal').classList.remove('hidden');
        }
      }

      gameState.pendingActions.push({
        playerId: p.id,
        usedCardInstanceId: cardId,
        card,
        targetId
      });

      // الانتقال للاعب التالي أو فتح التصويت الجماعي
      gameState.currentTurnIndex++;
      if (gameState.currentTurnIndex >= gameState.players.length) {
        await resolveRoundBackend();
      } else {
        updateBoard();
      }
    }

    function closeRevealModal() {
      document.getElementById('reveal-modal').classList.add('hidden');
    }

    async function openBuyCardModal() {
      const p = gameState.players[gameState.currentTurnIndex];
      const res = await fetch('/api/index', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'buy_card', players: gameState.players, playerId: p.id })
      });
      const data = await res.json();
      if (data.error) {
        alert(data.message || 'تعذر شراء البطاقة.');
        return;
      }
      gameState.players = data.players;
      alert(`تم شراء بطاقة جديدة بنجاح! (${data.boughtCard.name})`);
      updateBoard();
    }

    async function resolveRoundBackend() {
      const res = await fetch('/api/index', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'resolve_round',
          players: gameState.players,
          actions: gameState.pendingActions,
          pendingMessages: gameState.pendingMessages
        })
      });
      const data = await res.json();
      gameState.players = data.players;
      gameState.pendingMessages = data.pendingMessages;
      gameState.courtCase = data.courtCase;

      // الانتقال لشاشة التصويت الجماعي
      document.getElementById('game-board').classList.add('hidden');
      document.getElementById('voting-screen').classList.remove('hidden');

      document.getElementById('ai-court-clue').innerText = data.courtCase.clue;
      const evBox = document.getElementById('global-event-box');
      if (data.courtCase.globalEvent) {
        evBox.classList.remove('hidden');
        evBox.innerHTML = `<b>حدث عام في القصر:</b> ${data.courtCase.globalEvent.title} - ${data.courtCase.globalEvent.description}`;
      } else {
        evBox.classList.add('hidden');
      }

      // إعداد قائمة التصويت الجماعي
      const votingList = document.getElementById('group-voting-list');
      votingList.innerHTML = gameState.players.map(voter => `
        <div class="bg-gray-950 p-3 rounded-xl border border-gray-800 flex justify-between items-center">
          <span class="font-bold text-white">${voter.name} يصوت ضد:</span>
          <select data-voter="${voter.id} class="vote-select bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-white text-sm focus:outline-none">
            <option value="NONE">لا توجد اتهامات</option>
            ${gameState.players.map(pl => `<option value="${pl.id}">${pl.name}</option>`).join('')}
          </select>
        </div>
      `).join('');
    }

    async function submitGroupVotes() {
      const selects = document.querySelectorAll('.vote-select, select[data-voter]');
      // بدلاً من الاستعلام المعقد، نجمع الأصوات مباشرة من العناصر داخل قائمة التصويت
      const container = document.getElementById('group-voting-list');
      const rows = container.querySelectorAll('div');
      const votes = [];

      rows.forEach(row => {
        const select = row.querySelector('select');
        // استخراج معرف المصوت من مكان ما أو نربطه بالترتيب
      });

      // طريقة أسهل وأضمن لتجميع أصوات اللاعبين
      const voteSelects = document.querySelectorAll('#group-voting-list select');
      const formattedVotes = gameState.players.map((voter, idx) => ({
        voterId: voter.id,
        accusedId: voteSelects[idx]?.value || 'NONE'
      }));

      const res = await fetch('/api/index', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'resolve_vote',
          players: gameState.players,
          trueCulpritId: gameState.courtCase.trueCulpritId,
          votes: formattedVotes
        })
      });
      const data = await res.json();
      gameState.players = data.players;

      alert(data.verdictMsg);

      // بدء جولة جديدة وتصفية الأكشنات
      gameState.roundNumber++;
      gameState.currentTurnIndex = 0;
      gameState.pendingActions = [];

      document.getElementById('voting-screen').classList.add('hidden');
      document.getElementById('game-board').classList.remove('hidden');
      updateBoard();
    }
  </script>
</body>
</html>
