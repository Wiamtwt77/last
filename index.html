<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المحكمة السرية</title>
<style>
:root{--bg:#080b14;--panel:#121a2a;--line:#26334d;--red:#f43f5e;--gold:#fbbf24;--purple:#a855f7;--blue:#38bdf8;--green:#22c55e}*{box-sizing:border-box}body{margin:0;padding:14px;background:radial-gradient(circle at top,#17213a,#080b14 65%);color:#f8fafc;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto}.panel{background:#121a2aee;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0005}button{width:100%;padding:11px;margin-top:8px;border:0;border-radius:9px;background:var(--red);color:#fff;font-weight:700;cursor:pointer}button.alt{background:#334155}button.gold{background:#d97706;color:#fff}input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid var(--line);border-radius:9px;background:#070b14;color:#fff}textarea{min-height:80px}.grid,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.player,.card,.box{padding:11px;border-radius:10px}.player{background:#080b14;border:1px solid var(--line);text-align:center}.card{border:2px solid #334155;background:#1a2437;cursor:pointer}.card.exceptional{border-color:var(--gold);background:#2d2109}.card.sel{border-color:var(--red);background:#36202c}.card.off{opacity:.45;cursor:not-allowed}.box{margin:9px 0;white-space:pre-line}.inbox{border-right:4px solid var(--blue);background:#10263b}.ally{border-right:4px solid var(--purple);background:#28173b}.clue{border-right:4px solid var(--purple);background:#21152f}.attacked{border-right:4px solid var(--red);background:#2b141d}.shop{border:1px dashed var(--gold);padding:10px;margin-top:10px;border-radius:10px;background:#18150a}.muted{color:#a9b4c7;font-size:.86em}.small{font-size:.78em;color:#cbd5e1}.danger{color:#fb7185}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>
<body><main class="app"><div class="top"><h1>المحكمة السرية</h1><button class="alt" style="width:auto" onclick="newGame()">جلسة جديدة</button></div>
<section id="setup" class="panel"><h2>إعداد الجلسة</h2><p class="muted">أدخل أسماء اللاعبين مفصولة بفواصل. اللعبة تعتمد على تمرير الهاتف والتحالفات سرية بالكامل.</p><input id="names" value="أحمد, سارة, خالد"><button onclick="startGame()">بدء اللعبة</button></section>
<section id="game" class="hidden"><div id="status" class="grid"></div><section id="action" class="panel"><div id="curtain"><h2 id="turnTitle"></h2><button id="curtainButton" onclick="openTurn()">فتح الدور السري</button></div><div id="turn" class="hidden"><h2 id="playerName"></h2><div id="inbox" class="box inbox hidden"></div><div id="offer" class="box ally hidden"></div><div id="allyStatus" class="box ally hidden"></div><h3>بطاقاتك المتاحة</h3><div id="cards" class="cards"></div><div id="shopArea" class="shop"><h4>🛒 متجر البطاقات الاستثنائية</h4><p class="small">يمكنك استبدال 1 نقطة سمعة لشراء بطاقة استثنائية وإضافتها ليدك.</p><div id="shopCards" class="cards"></div></div><div id="targetArea" class="hidden"><label>الهدف</label><select id="target"></select></div><div id="textArea" class="hidden"><label>نص الرسالة</label><textarea id="messageText" maxlength="300"></textarea></div><button onclick="submitAction()">تأكيد الحركة وتسليم الهاتف</button></div></section>
<section id="recap" class="panel hidden"><h2>ملخص الجولة والتقرير الأمني</h2><div id="attackedBox" class="box attacked"></div><div id="case" class="box"></div><div id="clue" class="box clue"></div><button onclick="startVote()">الانتقال إلى التصويت السري</button></section>
<section id="vote" class="panel hidden"><div id="voteCurtain"><h2 id="voteTitle"></h2><button onclick="openVote()">فتح التصويت</button></div><div id="voteForm" class="hidden"><div id="voteCase" class="box"></div><select id="voteTarget"></select><button onclick="submitVote()">تأكيد التصويت وتسليم الهاتف</button></div></section>
</section></main>
<script>
const EFFECT_LABEL={ALLIANCE_OFFER:'عرض تحالف',MESSAGE:'رسالة سرية',REPUTATION_LOSS:'خفض سمعة',STEAL:'سرقة نفوذ',REPUTATION_GAIN:'رفع سمعة',INVESTIGATE:'تحقيق سري',SHIELD:'درع حماية',EXCEPTIONAL_SHIELD:'درع ملكي',EXCEPTIONAL_ATTACK:'هجوم استثنائي',EXCEPTIONAL_GAIN:'تعزيز ملكي',EXCEPTIONAL_STEAL:'استحواذ أعظم'};
const STATIC_SHOP=[
  {baseId:'c22',name:'★ حصانة العرش المطلقة',description:'بطاقة استثنائية: حماية كاملة ورفع السمعة بمقدار 2.',effectType:'EXCEPTIONAL_SHIELD',power:2,targetRequired:false,cooldown:2,rarity:'استثنائية',cost:1},
  {baseId:'c23',name:'★ صدمة الاتهام الكبير',description:'بطاقة استثنائية: خفض سمعة الهدف بمقدار 4 نقاط.',effectType:'EXCEPTIONAL_ATTACK',power:4,targetRequired:true,cooldown:2,rarity:'استثنائية',cost:1},
  {baseId:'c24',name:'★ الإنقاذ الملكي',description:'بطاقة استثنائية: تمنحك 4 نقاط سمعة فوراً.',effectType:'EXCEPTIONAL_GAIN',power:4,targetRequired:false,cooldown:2,rarity:'استثنائية',cost:1},
  {baseId:'c25',name:'★ الاستحواذ الأعظم',description:'بطاقة استثنائية: تسلب 3 نقاط سمعة وتحولها إليك.',effectType:'EXCEPTIONAL_STEAL',power:3,targetRequired:true,cooldown:2,rarity:'استثنائية',cost:1}
];
let state=null,selected=null;
const $=id=>document.getElementById(id);
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('bonemotion-secret-court',JSON.stringify(state))}
function load(){try{return JSON.parse(localStorage.getItem('bonemotion-secret-court'))}catch{return null}}
function newGame(){localStorage.removeItem('bonemotion-secret-court');location.reload()}
function startGame(){const names=$('names').value.split(',').map(x=>x.trim()).filter(Boolean);if(names.length<2)return alert('أدخل اسمين على الأقل');const stamp=Date.now();state={players:names.map((name,i)=>({id:`player-${stamp}-${i}`,name,reputation:10,allyId:null,allyRoundsLeft:0,allianceOffer:null})),pendingMessages:{},pendingOffers:{},hands:{},round:0,currentTurn:0,actions:[],votes:[],voteTurn:0,currentCase:null};save();showGame();startRound()}
function showGame(){$('setup').classList.add('hidden');$('game').classList.remove('hidden');renderStatus()}
function renderStatus(){$('status').innerHTML=state.players.map(p=>`<div class="player"><b>${escapeHtml(p.name)}</b><br>${p.reputation>0?'⭐ '+p.reputation:'<span class="danger">مقصى</span>'}</div>`).join('')}
function resetPrivateUI(){selected=null;$('messageText').value='';$('target').innerHTML='';$('targetArea').classList.add('hidden');$('textArea').classList.add('hidden');$('inbox').innerHTML='';$('inbox').classList.add('hidden');$('offer').innerHTML='';$('offer').classList.add('hidden');$('allyStatus').innerHTML='';$('allyStatus').classList.add('hidden');$('cards').innerHTML=''}
function startRound(){state.round++;state.currentTurn=0;state.actions=[];state.votes=[];state.voteTurn=0;state.hands={};state.currentCase=null;save();$('recap').classList.add('hidden');$('vote').classList.add('hidden');$('action').classList.remove('hidden');showCurtain()}
function showCurtain(){resetPrivateUI();while(state.currentTurn<state.players.length&&!state.players[state.currentTurn].reputation)state.currentTurn++;if(state.currentTurn>=state.players.length)return resolveRound();$('turn').classList.add('hidden');$('curtain').classList.remove('hidden');$('turnTitle').textContent=`سلّم الهاتف إلى: ${state.players[state.currentTurn].name}`;$('curtainButton').textContent='فتح الدور السري';$('curtainButton').onclick=openTurn}
function renderPrivateInbox(p){const list=state.pendingMessages[p.id]||[];if(list.length){$('inbox').innerHTML=list.map(m=>`📩 <b>${escapeHtml(m.senderName||'النظام')}:</b> ${escapeHtml(m.text)}`).join('<hr>');$('inbox').classList.remove('hidden');delete state.pendingMessages[p.id];save()}}
function renderOffer(p){const list=state.pendingOffers?.[p.id]||[];if(!list.length){$('offer').innerHTML='';$('offer').classList.add('hidden');return}const o=list[0];$('offer').innerHTML=`🤝 عرض تحالف سري من <b>${escapeHtml(o.fromName)}</b> لمدة 4 جولات.<button onclick="respondAlliance(true)">قبول التحالف</button><button class="alt" onclick="respondAlliance(false)">رفض العرض</button>`;$('offer').classList.remove('hidden');state.activeOffer=o;}
function renderAlliance(p){if(p.allyId){const a=state.players.find(x=>x.id===p.allyId);$('allyStatus').textContent=`🤝 حليفك السري: ${a?.name||'غير معروف'} (متبقي ${p.allyRoundsLeft} جولات)`;$('allyStatus').classList.remove('hidden')}}
function openTurn(){const p=state.players[state.currentTurn];resetPrivateUI();$('curtain').classList.add('hidden');$('turn').classList.remove('hidden');$('playerName').textContent=`الدور السري: ${p.name} (السمعة: ${p.reputation})`;renderPrivateInbox(p);renderOffer(p);renderAlliance(p);renderShop(p);loadHand(p)}
function renderShop(p){$('shopCards').innerHTML=STATIC_SHOP.map(c=>`<div class="card exceptional"><b>${escapeHtml(c.name)}</b><br><span class="small">${escapeHtml(c.description)}</span><br><button class="gold" onclick="buyCard('${c.baseId}')">شراء (تكلفة: 1 سمعة)</button></div>`).join('')}
async function buyCard(baseId){const p=state.players[state.currentTurn];if(p.reputation<=1)return alert('سمعتك لا تكفي للشراء!');try{const d=await post({action:'buy_card',playerId:p.id,cardBaseId:baseId,players:state.players});state.players=d.players;if(!state.hands[p.id])state.hands[p.id]=[];state.hands[p.id].push(d.boughtCard);save();renderStatus();renderHand(p,state.hands[p.id]);alert('تمت إضافة البطاقة الاستثنائية إلى يدك!')}catch(e){alert(e.message)}}
function fallbackHand(){const id=()=>`local-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;return [{id:id(),baseId:'c01',name:'دعوة التحالف',description:'إرسال عرض تحالف سري إلى لاعب واحد.',effectType:'ALLIANCE_OFFER',power:0,targetRequired:true,cooldown:1,rarity:'مضمونة'},{id:id(),baseId:'c03',name:'مرآة الاتهام',description:'تخفض نقطتين من سمعة الهدف.',effectType:'REPUTATION_LOSS',power:2,targetRequired:true,cooldown:1,rarity:'عادية'},{id:id(),baseId:'c11',name:'ختم البراءة',description:'ترفع سمعتك نقطتين.',effectType:'REPUTATION_GAIN',power:2,targetRequired:false,cooldown:1,rarity:'عادية'}]}
async function loadHand(p){if(state.hands[p.id])return renderHand(p,state.hands[p.id]);try{const d=await post({action:'generate_cards',round:state.round});state.hands[p.id]=d.cards;save();renderHand(p,d.cards)}catch(e){state.hands[p.id]=fallbackHand();save();renderHand(p,state.hands[p.id])}}
function renderHand(p,hand){$('cards').innerHTML=hand.map(c=>`<div class="card ${c.rarity==='استثنائية'?'exceptional':''}" data-card="${escapeHtml(c.id)}" onclick="selectCard('${escapeHtml(c.id)}',this)"><b>${escapeHtml(c.name)}</b><br><span class="small">${escapeHtml(c.description)}<br>الأثر: ${escapeHtml(EFFECT_LABEL[c.effectType]||c.effectType)} · القوة ${c.power||0} · ${escapeHtml(c.rarity||'')}</span></div>`).join('')}
function selectCard(id,el){const p=state.players[state.currentTurn];selected=(state.hands[p.id]||[]).find(c=>c.id===id);if(!selected)return;document.querySelectorAll('#cards .card').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');const needs=Boolean(selected.targetRequired);$('targetArea').classList.toggle('hidden',!needs);$('textArea').classList.toggle('hidden',selected.effectType!=='MESSAGE');if(needs)$('target').innerHTML=state.players.filter(x=>x.id!==p.id&&x.reputation>0).map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('')}
function submitAction(){if(!selected)return alert('اختر بطاقة');const p=state.players[state.currentTurn];const targetId=selected.targetRequired?$('target').value:null;if(selected.targetRequired&&!targetId)return alert('اختر هدفًا');if(selected.effectType==='MESSAGE'&&!$('messageText').value.trim())return alert('اكتب الرسالة');state.actions.push({playerId:p.id,targetId,cardId:selected.id,generatedCard:selected,text:$('messageText').value.trim()});save();state.currentTurn++;showCurtain()}
function respondAlliance(accepted){const p=state.players[state.currentTurn],o=state.activeOffer;if(!o)return;state.pendingOffers=state.pendingOffers||{};if(accepted){const from=state.players.find(x=>x.id===o.fromId);if(from&&from.reputation>0&&!p.allyId&&!from.allyId){p.allyId=from.id;p.allyRoundsLeft=4;from.allyId=p.id;from.allyRoundsLeft=4}}state.pendingOffers[p.id]=(state.pendingOffers[p.id]||[]).filter(x=>x.id!==o.id);delete state.activeOffer;save();renderOffer(p);renderAlliance(p);renderStatus()}
async function resolveRound(){resetPrivateUI();$('action').classList.add('hidden');try{const d=await post({action:'resolve_round',players:state.players,actions:state.actions,pendingMessages:state.pendingMessages});state.players=d.players;state.pendingMessages=d.pendingMessages||{};state.pendingOffers=d.pendingOffers||{};state.currentCase=d.courtCase;save();renderStatus();showRecap()}catch(e){$('action').classList.remove('hidden');$('curtain').classList.remove('hidden');$('turn').classList.add('hidden');$('turnTitle').textContent='تعذر حسم الجولة — أعد المحاولة';$('curtainButton').onclick=resolveRound;alert(e.message)}}
function showRecap(){$('recap').classList.remove('hidden');$('attackedBox').textContent=state.currentCase.attackedText||'';$('case').textContent=state.currentCase.title;$('clue').textContent='🔒 الدليل المستخرج (شبهة غامضة وقد تكون مضللة):\n'+state.currentCase.clue+`\n(نسبة التقدير الظني: ${state.currentCase.confidence}%)`}
function startVote(){state.voteTurn=0;state.votes=[];$('recap').classList.add('hidden');$('vote').classList.remove('hidden');showVoteCurtain()}
function showVoteCurtain(){while(state.voteTurn<state.players.length&&!state.players[state.voteTurn].reputation)state.voteTurn++;if(state.voteTurn>=state.players.length)return finalizeVote();$('voteForm').classList.add('hidden');$('voteCurtain').classList.remove('hidden');$('voteTitle').textContent=`سلّم الهاتف لتصويت: ${state.players[state.voteTurn].name}`}
function openVote(){$('voteCurtain').classList.add('hidden');$('voteForm').classList.remove('hidden');$('voteCase').textContent='من تعتقد أنه يقف خلف الشائعات والأحداث في أروقة المحكمة؟';$('voteTarget').innerHTML='<option value="NONE">امتناع / لا أحد</option>'+state.players.filter((p,i)=>p.reputation>0&&i!==state.voteTurn).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
function submitVote(){const p=state.players[state.voteTurn];const v=$('voteTarget').value;state.votes.push({voterId:p.id,accusedId:v==='NONE'?null:v});state.voteTurn++;save();showVoteCurtain()}
async function finalizeVote(){try{const d=await post({action:'resolve_vote',players:state.players,votes:state.votes,trueCulpritId:state.currentCase.trueCulpritId});state.players=d.players;save();alert(d.verdictMsg+`\n\nنتيجة التحليل الظني: ${d.finalEvidence.conclusion}`);if(state.players.filter(p=>p.reputation>0).length<=1)return newGame();startRound()}catch(e){alert('تعذر حسم التصويت: '+e.message);$('vote').classList.remove('hidden')}}
async function post(body){let response;try{response=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch{throw Error('تعذر الاتصال بمسار API')}let data;try{data=await response.json()}catch{throw Error(`استجابة API غير صالحة`)}if(!response.ok)throw Error(data.message||data.error||`خطأ API`);return data}
state=load();if(state&&state.players?.length){showGame();if(state.currentCase)showRecap();else{$('action').classList.remove('hidden');showCurtain()}}
</script></body></html>
