<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المحكمة السرية</title>
<style>
:root{--bg:#080b14;--panel:#121a2a;--line:#26334d;--red:#f43f5e;--gold:#fbbf24;--purple:#a855f7;--blue:#38bdf8}*{box-sizing:border-box}body{margin:0;padding:14px;background:radial-gradient(circle at top,#17213a,#080b14 65%);color:#f8fafc;font-family:system-ui,sans-serif}.app{max-width:760px;margin:auto}.panel{background:#121a2aee;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0005}button{width:100%;padding:11px;margin-top:8px;border:0;border-radius:9px;background:var(--red);color:#fff;font-weight:700;cursor:pointer}button.alt{background:#334155}button.gold{background:#d97706;color:#fff}input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid var(--line);border-radius:9px;background:#070b14;color:#fff}textarea{min-height:80px}.grid,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.player,.card,.box{padding:11px;border-radius:10px}.player{background:#080b14;border:1px solid var(--line);text-align:center}.card{border:2px solid #334155;background:#1a2437;cursor:pointer}.card.exceptional{border-color:var(--gold);background:#2d2109}.card.sel{border-color:var(--red);background:#36202c}.box{margin:9px 0;white-space:pre-line}.inbox{border-right:4px solid var(--blue);background:#10263b}.ally{border-right:4px solid var(--purple);background:#28173b}.clue{border-right:4px solid var(--purple);background:#21152f}.attacked{border-right:4px solid var(--red);background:#2b141d}.muted{color:#a9b4c7;font-size:.86em}.small{font-size:.78em;color:#cbd5e1}.danger{color:#fb7185}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>
<body><main class="app"><div class="top"><h1>المحكمة السرية</h1><button class="alt" style="width:auto" onclick="newGame()">جلسة جديدة</button></div>
<section id="setup" class="panel"><h2>إعداد الجلسة</h2><p class="muted">أدخل أسماء اللاعبين مفصولة بفواصل. اللعبة تعتمد على تمرير الهاتف والتحالفات سرية بالكامل.</p><input id="names" value="أحمد, سارة, خالد"><button onclick="startGame()">بدء اللعبة</button></section>
<section id="game" class="hidden"><div id="status" class="grid"></div><section id="action" class="panel"><div id="curtain"><h2 id="turnTitle"></h2><button id="curtainButton" onclick="openTurn()">فتح الدور السري</button></div><div id="turn" class="hidden"><h2 id="playerName"></h2><div id="inbox" class="box inbox hidden"></div><div id="allyStatus" class="box ally hidden"></div><h3>بطاقاتك المتاحة (2 عشوائية)</h3><div id="cards" class="cards"></div><button class="gold" onclick="buyRandomCard()">🎲 شراء بطاقة عشوائية إضافية (التكلفة: 1 سمعة)</button><div id="targetArea" class="hidden"><label>الهدف</label><select id="target"></select></div><div id="textArea" class="hidden"><label>نص الرسالة</label><textarea id="messageText" maxlength="300"></textarea></div><button onclick="submitAction()">تأكيد الحركة وتسليم الهاتف</button></div></section>
<section id="recap" class="panel hidden"><h2>تقرير نهاية الجولة</h2><div id="attackedBox" class="box attacked"></div><div id="clue" class="box clue"></div><button onclick="startVote()">الانتقال إلى التصويت السري</button></section>
<section id="vote" class="panel hidden"><div id="voteCurtain"><h2 id="voteTitle"></h2><button onclick="openVote()">فتح التصويت</button></div><div id="voteForm" class="hidden"><div id="voteCase" class="box">من تعتقد أنه المسبب للأحداث خلف الكواليس؟</div><select id="voteTarget"></select><button onclick="submitVote()">تأكيد التصويت وتسليم الهاتف</button></div></section>
</section></main>
<script>
const EFFECT_LABEL={ALLIANCE_OFFER:'عرض تحالف',MESSAGE:'رسالة سرية',REPUTATION_LOSS:'خفض سمعة',STEAL:'سرقة نفوذ',REPUTATION_GAIN:'رفع سمعة',INVESTIGATE:'تحقيق سري',SHIELD:'درع حماية',EXCEPTIONAL_SHIELD:'درع ملكي',EXCEPTIONAL_ATTACK:'هجوم استثنائي',EXCEPTIONAL_GAIN:'تعزيز ملكي',EXCEPTIONAL_STEAL:'استحواذ أعظم'};
let state=null,selected=null;
const $=id=>document.getElementById(id);
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem('bonemotion-secret-court',JSON.stringify(state))}
function load(){try{return JSON.parse(localStorage.getItem('bonemotion-secret-court'))}catch{return null}}
function newGame(){localStorage.removeItem('bonemotion-secret-court');location.reload()}
function startGame(){const names=$('names').value.split(',').map(x=>x.trim()).filter(Boolean);if(names.length<2)return alert('أدخل اسمين على الأقل');const stamp=Date.now();state={players:names.map((name,i)=>({id:`player-${stamp}-${i}`,name,reputation:10,allyId:null,allyRoundsLeft:0})),pendingMessages:{},hands:{},round:0,currentTurn:0,actions:[],votes:[],voteTurn:0,currentCase:null};save();showGame();startRound()}
function showGame(){$('setup').classList.add('hidden');$('game').classList.remove('hidden');renderStatus()}
function renderStatus(){$('status').innerHTML=state.players.map(p=>`<div class="player"><b>${escapeHtml(p.name)}</b><br>${p.reputation>0?'⭐ '+p.reputation:'<span class="danger">مقصى</span>'}</div>`).join('')}
function resetPrivateUI(){selected=null;$('messageText').value='';$('target').innerHTML='';$('targetArea').classList.add('hidden');$('textArea').classList.add('hidden');$('inbox').innerHTML='';$('inbox').classList.add('hidden');$('allyStatus').innerHTML='';$('allyStatus').classList.add('hidden');$('cards').innerHTML=''}
function startRound(){state.round++;state.currentTurn=0;state.actions=[];state.votes=[];state.voteTurn=0;state.hands={};state.currentCase=null;save();$('recap').classList.add('hidden');$('vote').classList.add('hidden');$('action').classList.remove('hidden');showCurtain()}
function showCurtain(){resetPrivateUI();while(state.currentTurn<state.players.length&&!state.players[state.currentTurn].reputation)state.currentTurn++;if(state.currentTurn>=state.players.length)return resolveRound();$('turn').classList.add('hidden');$('curtain').classList.remove('hidden');$('turnTitle').textContent=`سلّم الهاتف إلى: ${state.players[state.currentTurn].name}`;$('curtainButton').textContent='فتح الدور السري';$('curtainButton').onclick=openTurn}
function renderPrivateInbox(p){const list=state.pendingMessages[p.id]||[];if(list.length){let html='';list.forEach((m,idx)=>{if(m.kind==='alliance_offer'){html+=`🤝 <b>${escapeHtml(m.text)}</b><br><button onclick="acceptAlliance('${m.fromId}', ${idx})">قبول التحالف السري</button><hr>`;}else{html+=`📩 <b>${escapeHtml(m.fromName)}:</b> ${escapeHtml(m.text)}<hr>`;}});$('inbox').innerHTML=html;$('inbox').classList.remove('hidden');}}
function acceptAlliance(fromId, msgIdx){const p=state.players[state.currentTurn];const from=state.players.find(x=>x.id===fromId);if(from&&!p.allyId&&!from.allyId){p.allyId=from.id;p.allyRoundsLeft=4;from.allyId=p.id;from.allyRoundsLeft=4;alert(`تم عقد التحالف السري مع ${from.name}!`);state.pendingMessages[p.id].splice(msgIdx,1);save();renderStatus();renderAlliance(p);renderPrivateInbox(p);}}
function renderAlliance(p){if(p.allyId){const a=state.players.find(x=>x.id===p.allyId);$('allyStatus').textContent=`🤝 حليفك السري: ${a?.name||'غير معروف'} (متبقي ${p.allyRoundsLeft} جولات)`;$('allyStatus').classList.remove('hidden');}}
function openTurn(){const p=state.players[state.currentTurn];resetPrivateUI();$('curtain').classList.add('hidden');$('turn').classList.remove('hidden');$('playerName').textContent=`الدور السري: ${p.name} (السمعة: ${p.reputation})`;renderPrivateInbox(p);renderAlliance(p);loadHand(p)}
async function buyRandomCard(){const p=state.players[state.currentTurn];if(p.reputation<=1)return alert('سمعتك يجب أن تكون أكثر من 1 لشراء بطاقة!');try{const d=await post({action:'buy_card',playerId:p.id,players:state.players});state.players=d.players;if(!state.hands[p.id])state.hands[p.id]=[];state.hands[p.id].push(d.boughtCard);save();renderStatus();renderHand(p,state.hands[p.id]);alert(`حصلت على بطاقة عشوائية: ${d.boughtCard.name}`)}catch(e){alert(e.message)}}
async function loadHand(p){if(state.hands[p.id])return renderHand(p,state.hands[p.id]);try{const d=await post({action:'generate_cards'});state.hands[p.id]=d.cards;save();renderHand(p,d.cards)}catch(e){alert('تعذر جلب البطاقات العشوائية');}}
function renderHand(p,hand){$('cards').innerHTML=hand.map(c=>`<div class="card ${c.rarity==='استثنائية'?'exceptional':''}" data-card="${escapeHtml(c.id)}" onclick="selectCard('${escapeHtml(c.id)}',this)"><b>${escapeHtml(c.name)}</b><br><span class="small">${escapeHtml(c.description)}<br>الأثر: ${escapeHtml(EFFECT_LABEL[c.effectType]||c.effectType)} · القوة ${c.power||0}</span></div>`).join('')}
function selectCard(id,el){const p=state.players[state.currentTurn];selected=(state.hands[p.id]||[]).find(c=>c.id===id);if(!selected)return;document.querySelectorAll('#cards .card').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');const needs=Boolean(selected.targetRequired);$('targetArea').classList.toggle('hidden',!needs);$('textArea').classList.toggle('hidden',selected.effectType!=='MESSAGE');if(needs)$('target').innerHTML=state.players.filter(x=>x.id!==p.id&&x.reputation>0).map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('')}
function submitAction(){if(!selected)return alert('اختر بطاقة أولاً');const p=state.players[state.currentTurn];const targetId=selected.targetRequired?$('target').value:null;if(selected.targetRequired&&!targetId)return alert('اختر هدفاً للبطاقة');if(selected.effectType==='MESSAGE'&&!$('messageText').value.trim())return alert('اكتب نص الرسالة');state.actions.push({playerId:p.id,targetId,cardId:selected.id,generatedCard:selected,text:$('messageText').value.trim()});delete state.pendingMessages[p.id];save();state.currentTurn++;showCurtain()}
async function resolveRound(){resetPrivateUI();$('action').classList.add('hidden');try{const d=await post({action:'resolve_round',players:state.players,actions:state.actions,pendingMessages:state.pendingMessages});state.players=d.players;state.pendingMessages=d.pendingMessages||{};state.currentCase=d.courtCase;save();renderStatus();showRecap()}catch(e){$('action').classList.remove('hidden');showCurtain();alert(e.message)}}
function showRecap(){$('recap').classList.remove('hidden');$('attackedBox').textContent=state.currentCase.attackedText||'';$('clue').textContent='🔒 الدليل الشبهي الظني (قد يكون مضللاً):\n'+state.currentCase.clue+`\n(نسبة التقدير الظني: ${state.currentCase.confidence}%)`}
function startVote(){state.voteTurn=0;state.votes=[];$('recap').classList.add('hidden');$('vote').classList.remove('hidden');showVoteCurtain()}
function showVoteCurtain(){while(state.voteTurn<state.players.length&&!state.players[state.voteTurn].reputation)state.voteTurn++;if(state.voteTurn>=state.players.length)return finalizeVote();$('voteForm').classList.add('hidden');$('voteCurtain').classList.remove('hidden');$('voteTitle').textContent=`سلّم الهاتف للتصويت: ${state.players[state.voteTurn].name}`}
function openVote(){$('voteCurtain').classList.add('hidden');$('voteForm').classList.remove('hidden');$('voteTarget').innerHTML='<option value="NONE">امتناع / لا أحد</option>'+state.players.filter((p,i)=>p.reputation>0&&i!==state.voteTurn).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
function submitVote(){const p=state.players[state.voteTurn];const v=$('voteTarget').value;state.votes.push({voterId:p.id,accusedId:v==='NONE'?null:v});state.voteTurn++;save();showVoteCurtain()}
async function finalizeVote(){try{const d=await post({action:'resolve_vote',players:state.players,votes:state.votes,trueCulpritId:state.currentCase.trueCulpritId});state.players=d.players;save();alert(d.verdictMsg);if(state.players.filter(p=>p.reputation>0).length<=1)return newGame();startRound()}catch(e){alert('تعذر حسم التصويت: '+e.message);$('vote').classList.remove('hidden')}}
async function post(body){let response=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data=await response.json();if(!response.ok)throw Error(data.message||data.error||'خطأ API');return data}
state=load();if(state&&state.players?.length){showGame();if(state.currentCase)showRecap();else{$('action').classList.remove('hidden');showCurtain()}}
</script></body></html>
